[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls to Render (must deploy backend first; see render.yaml)
[[redirects]]
  from = "/api/*"
  to = "https://faraaz-file-upload-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: React client-side routes (e.g. password reset ?resetToken=...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
